<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy</title><style>
:root{--ink:#17252a;--mute:#5d6b70;--bg:#eef2f4;--card:#fff;--line:#d3dcdf;--ok:#0f766e;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,"Noto Sans Kannada",sans-serif;color:var(--ink);background:var(--bg)}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.wide{grid-column:1/-1}input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
input{width:100%;margin:8px 0}button{cursor:pointer;background:#fff}button:focus-visible,input:focus-visible{outline:3px solid #7cc4bd}
.primary{background:var(--ok);color:#fff;border-color:var(--ok)}.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card.blocked{border-color:var(--bad);background:#fff4f2}.tag{font-size:13px;color:var(--mute)}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}.log small{color:var(--mute)}.kn{font-size:15px}
</style></head><body>
<header><h1>Proxy</h1><button onclick="api('reset')">Reset demo</button></header>
<main>
<section><h2>Amma (requester)</h2>
<div class="row"><select id="lang"><option value="en-IN">English</option><option value="kn-IN">ಕನ್ನಡ</option><option value="hi-IN">हिन्दी</option></select>
<button onclick="listen()" id="mic">Speak</button></div>
<input id="q" placeholder="Pay the current bill and book my eye checkup Thursday" onkeydown="if(event.key=='Enter')ask()">
<button class="primary" onclick="ask()">Ask Proxy</button>
<p class="tag">Try: “Send ₹20,000 to this number, it’s urgent” to see a hard block.</p></section>
<section><h2>Pooja (approver)</h2><div id="cards"><p class="tag">Nothing waiting for approval.</p></div></section>
<section class="wide"><h2>Ledger (read back to Amma by voice)</h2><div class="log" id="log"></div></section>
</main><script>
let spoken=0;const $=id=>document.getElementById(id);
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json()).then(refresh);
function ask(){const t=$('q').value.trim();if(t){api('ask',{text:t});$('q').value=''}}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Speech input needs Chrome. Type instead.');
const r=new R();r.lang=$('lang').value;r.onresult=e=>{$('q').value=e.results[0][0].transcript;ask()};r.start()}
function edit(a){const v=prompt(a.type=='book'?'New slot':'New amount (₹)',a.type=='book'?a.slot:a.amount);if(v)api('approve/'+a.id,a.type=='book'?{slot:v}:{amount:+v})}
async function refresh(){const s=await (await fetch('/api/state')).json();
const live=s.actions.filter(a=>a.status=='pending'||a.status=='blocked'||a.status=='done');
$('cards').innerHTML=live.map(a=>a.status=='pending'?`<div class="card"><b>${a.what}</b><div class="tag">${a.type=='pay_bill'?'Account ending 4417. ':''}Token: one use, 30 min.</div>
<div class="row" style="margin-top:8px"><button class="primary" onclick="api('approve/${a.id}')">Approve</button><button onclick='edit(${JSON.stringify(a)})'>Edit</button><button class="danger" onclick="api('reject/${a.id}')">Reject</button></div></div>`
:a.status=='blocked'?`<div class="card blocked"><b>Blocked:</b> ${a.what}<div class="tag">Matched a scam rule. Nothing ran.</div></div>`
:`<div class="card"><b>Done:</b> ${a.what} <button style="float:right" onclick="api('undo/${a.id}')">Undo</button></div>`).join('')||'<p class="tag">Nothing waiting for approval.</p>';
$('log').innerHTML=s.ledger.slice().reverse().map(e=>`<div>${e.en}<br><span class="kn">${e.kn}</span> <small>${e.t}</small></div>`).join('');
if(s.ledger.length<spoken)spoken=0;
s.ledger.slice(spoken).forEach(e=>{const u=new SpeechSynthesisUtterance($('lang').value=='en-IN'?e.en:e.kn);u.lang=$('lang').value=='en-IN'?'en-IN':'kn-IN';speechSynthesis.speak(u)});spoken=s.ledger.length}
refresh();setInterval(refresh,2000);
</script></body></html>
